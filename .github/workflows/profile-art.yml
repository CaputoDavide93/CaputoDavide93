# Redraws the contribution snake from live data (light + dark, GitHub's own
# palettes). Scheduled runs are off until the repo variable PROFILE_ART=on is
# set, so a private copy of this repo spends no Actions minutes.
name: Profile art

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  draw:
    if: vars.PROFILE_ART == 'on' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            docs/assets/snake-light.svg
            docs/assets/snake-dark.svg?palette=github-dark

      - name: Remove the progress bar under the snake
        run: python3 tools/strip_snake_bar.py docs/assets/snake-light.svg docs/assets/snake-dark.svg

      - name: Commit if anything changed
        run: |
          git add docs/assets
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: redraw contribution snake"
          git push
