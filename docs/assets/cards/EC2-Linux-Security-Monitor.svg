<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-label="EC2-Linux-Security-Monitor: ClamAV, auto-updates and a status dashboard for Linux servers">
<defs><pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".35"/></pattern><radialGradient id="vg" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient><filter id="ph" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="420" height="150" rx="18" fill="#160e03"/>
<g filter="url(#ph)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
<rect x="20" y="20" width="380" height="26" fill="#ffb347"/>
<text x="30" y="38" font-size="14" font-weight="700" fill="#160e03">EC2-Linux-Security-Monitor</text>
<text x="24" y="72" font-size="13" fill="#ffb347">ClamAV, auto-updates and a status dashboard</text>
<text x="24" y="91" font-size="13" fill="#ffb347">for Linux servers</text>
<text x="24" y="126" font-size="12" fill="#b8782a" xml:space="preserve">lang=shell  rel=none  lic=MIT</text>
</g>
<rect width="420" height="150" rx="18" fill="url(#sl)"><animate attributeName="opacity" values=".9;1;.93;1" dur="0.18s" repeatCount="indefinite"/></rect><rect width="420" height="150" rx="18" fill="url(#vg)"/><rect x="3" y="3" width="414" height="144" rx="16" fill="none" stroke="#6b4512" stroke-width="2"/>
</svg>
